[versions]
# Build tooling — pinned to the AGP 8.x stable line.
# AGP 9.x was attempted but it registers its own `kotlin {}` extension
# which collides with the Kotlin Gradle Plugin; until that lands cleanly
# in a stable release, AGP 8.7.x + Gradle 8.10.x + KSP1 is the proven
# combo for Kotlin 2.1.21 + Compose BOM 2024.12.x.
# AGP 8.9.x is the last stable 8.x — supports compileSdk 36 (Android 16),
# does NOT register the `kotlin {}` extension AGP 9 added (so no plugin
# clash with Kotlin Gradle Plugin), and is the floor required by recent
# AndroidX libs like browser 1.10.x.
agp                       = "8.9.2"
# Kotlin pinned to 2.1.20 because that's the latest minor where KSP1
# (`<kotlin>-1.0.x`) has a stable release. Kotlin 2.1.21 only has KSP2
# builds (`-2.0.x`), and Hilt 2.52 isn't yet validated on KSP2.
kotlin                    = "2.1.20"
googleDevtoolsKsp         = "2.1.20-1.0.32"
# Hilt 2.56.x is the first stable line to handle Kotlin 2.1.x metadata
# from its Java annotation processor. 2.52 chokes on the 2.1.20 binaries
# with "Unable to read Kotlin metadata due to unsupported metadata version".
hilt                      = "2.56.2"
googleServices            = "4.4.2"

# AndroidX core
coreKtx                   = "1.15.0"
appcompat                 = "1.7.0"
material                  = "1.12.0"
activityCompose           = "1.10.1"
lifecycleRuntimeKtx       = "2.8.7"
lifecycleViewmodelCompose = "2.8.7"
lifecycleRuntimeCompose   = "2.8.7"
navigationCompose         = "2.8.9"
androidxBrowser           = "1.8.0"
datastorePreferences      = "1.1.7"
securityCrypto            = "1.1.0-beta01"
workRuntimeKtx            = "2.10.0"

# Jetpack Compose BOM — last stable BOM that works with AGP 8.7.x +
# Kotlin 2.1.21 (material3 1.3.1, foundation/ui 1.7.5).
composeBom                = "2024.12.01"
googleFonts               = "1.7.5"

# Camera
cameraCamera2             = "1.5.0"
cameraLifecycle           = "1.5.0"
cameraView                = "1.5.0"
cameraCore                = "1.5.0"

# Networking / image
coilCompose               = "2.7.0"
okhttp                    = "5.0.0"
loggingInterceptor        = "5.0.0"

# Kotlin libs
kotlinxCoroutinesAndroid  = "1.10.2"
kotlinxCoroutinesCore     = "1.10.2"
kotlinxCoroutinesTest     = "1.10.2"
kotlinxSerializationJson  = "1.7.3"

# Supabase & Ktor — pinned to 3.1.4 because the 3.6.x line was compiled
# against Kotlin 2.3.x which isn't available in Maven Central yet (top
# stable Kotlin = 2.2.0). 3.1.4 is the newest BOM that links cleanly
# against Kotlin 2.1.x. Re-pin once Kotlin 2.3.x ships.
supabase                  = "3.1.4"
ktor                      = "3.0.0"

# Firebase
firebaseBom               = "33.7.0"

# Location
playServicesLocation      = "21.3.0"

# E2E encryption (libsodium JNI for Android)
lazysodiumAndroid         = "5.1.0"
jna                       = "5.14.0"

# Permissions runtime helper
accompanistPermissions    = "0.37.3"

# Test
junit                     = "4.13.2"
junitVersion              = "1.3.0"
espressoCore              = "3.7.0"
core                      = "1.6.1"
runner                    = "1.6.2"

