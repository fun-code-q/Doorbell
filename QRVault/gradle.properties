# =============================================================================
# Project-wide Gradle settings for QRVault.
# Pinned to: Gradle 8.10.x / AGP 8.7.x / Kotlin 2.1.21 / KSP 1.0.x / JDK 21.
# =============================================================================

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m

# KSP — using KSP1 mode for compatibility with Hilt 2.52 + AGP 8.7.
# Re-enable KSP2 once Hilt's generated code is verified under KSP2 on this
# toolchain (Hilt 2.53+ supports KSP2 cleanly).
ksp.useKSP2=false

# R8 full mode (release builds only). Required for some Hilt scenarios.
android.enableR8.fullMode=true

# Non-transitive R class — faster builds, requires explicit R imports.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Resource shrinker reports
android.experimental.enableNewResourceShrinker.preciseShrinking=true
