name: Feature Request
description: Propose an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the expected behavior and UX.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Optional

  - type: dropdown
    id: impact
    attributes:
      label: Impact Area
      options:
        - Guest flow
        - Owner dashboard
        - Security
        - Deployment
        - Documentation
    validations:
      required: true
