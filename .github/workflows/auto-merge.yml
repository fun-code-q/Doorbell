name: Auto-merge Dependabot PRs

# Auto-merge dependabot's patch & minor updates once required checks
# are green. We do NOT auto-merge major bumps — those need eyes on them.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch'
                || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"

      - name: Flag major updates for review
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.html_url }}" --add-label "needs-human-review"
          gh pr comment "${{ github.event.pull_request.html_url }}" \
            --body "Major version bump — won't auto-merge. Please review for breaking changes."
