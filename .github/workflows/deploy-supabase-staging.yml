name: Deploy Supabase Edge Functions (staging)

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://supabase.com/dashboard/projects
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy push-ring-notification (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_STAGING }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
        run: |
          supabase functions deploy push-ring-notification --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy verify-ring (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_STAGING }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
        run: |
          supabase functions deploy verify-ring --project-ref "$SUPABASE_PROJECT_REF"
