name: Secure PWA Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Secrets into config.js
        run: |
          sed -i "s|REPLACE_WITH_YOUR_SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g" public/config.js
          sed -i "s|REPLACE_WITH_YOUR_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" public/config.js
          sed -i "s|REPLACE_WITH_YOUR_ENCRYPTION_PASSPHRASE|${{ secrets.ENCRYPTION_PASSPHRASE }}|g" public/config.js

      - name: Verify Secret Injection (Safe Check)
        run: |
          if grep -q "REPLACE_WITH_YOUR_SUPABASE_URL" public/config.js || grep -q "REPLACE_WITH_YOUR_ANON_KEY" public/config.js || grep -q "REPLACE_WITH_YOUR_ENCRYPTION_PASSPHRASE" public/config.js; then
            echo "Error: Secrets were not properly injected!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
