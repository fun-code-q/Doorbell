name: DB Migrations (staging on PR, production on merge)

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrations.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrations-${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
      url: https://supabase.com/dashboard/projects
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Lint migration filenames
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            if [[ ! $base =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$f::Migration name must match YYYYMMDDhhmmss_lower_snake.sql"
              exit 1
            fi
          done

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.event_name == 'pull_request'
              && secrets.SUPABASE_ACCESS_TOKEN_STAGING
              || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ github.event_name == 'pull_request'
              && secrets.SUPABASE_PROJECT_REF_STAGING
              || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ github.event_name == 'pull_request'
              && secrets.SUPABASE_DB_PASSWORD_STAGING
              || secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push
