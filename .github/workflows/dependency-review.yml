name: Dependency Review

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Block adding GPL-3.0 / AGPL-3.0 to a MIT-licensed product.
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
