<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f59e0b">
    <title>QR Doorbell - Offline</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root{--accent:#f59e0b;--bg:#050505;--text:#f8fafc;--muted:#64748b;--glass:rgba(255,255,255,0.02);--border:rgba(255,255,255,0.05)}
        body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
        .card{background:var(--glass);border:1px solid var(--border);padding:3rem 2rem;border-radius:2.5rem;backdrop-filter:blur(50px);max-width:400px;width:100%}
        h1{font-family:'Bricolage Grotesque',sans-serif;font-size:2rem;color:var(--accent);margin-bottom:1rem}
        p{color:var(--muted);margin-bottom:2rem;line-height:1.6}
        .btn{display:inline-block;padding:1rem 2rem;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:1.5rem;color:#000;font-weight:700;cursor:pointer;font-size:1rem;text-decoration:none}
        .btn:hover{transform:translateY(-2px)}
        .status{margin-top:1.5rem;font-size:0.85rem;color:var(--muted)}
    </style>
</head>
<body>
    <div class="card">
        <h1>QR Doorbell</h1>
        <p>You are currently offline. Please check your internet connection and try again.</p>
        <a href="index.html" class="btn">Retry Connection</a>
        <div class="status">Service Worker: Active | App shell is cached for offline access</div>
    </div>
</body>
</html>
