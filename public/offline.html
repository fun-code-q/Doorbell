<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f59e0b">
    <!--
      The offline page is a self-contained static fallback with one tiny
      inline language-detection script. We allow `'unsafe-inline'` here
      only because:
        * the page has no user input
        * it's served only by the SW when the network is down
        * adding a nonce would require a server, which we don't have
      The guest page (index.html) does NOT allow inline scripts.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; base-uri 'self'; form-action 'self';">
    <title>QR Doorbell — Offline</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root{--accent:#f59e0b;--bg:#050505;--text:#f8fafc;--muted:#64748b;--glass:rgba(255,255,255,0.02);--border:rgba(255,255,255,0.05)}
        body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
        .card{background:var(--glass);border:1px solid var(--border);padding:3rem 2rem;border-radius:2.5rem;backdrop-filter:blur(50px);max-width:400px;width:100%}
        h1{font-family:'Bricolage Grotesque',sans-serif;font-size:2rem;color:var(--accent);margin-bottom:1rem}
        p{color:var(--muted);margin-bottom:2rem;line-height:1.6}
        .btn{display:inline-block;padding:1rem 2rem;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:1.5rem;color:#000;font-weight:700;cursor:pointer;font-size:1rem;text-decoration:none}
        .status{margin-top:1.5rem;font-size:0.85rem;color:var(--muted)}
        :lang(de) .en, :lang(en) .de { display:none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>QR Doorbell</h1>
        <p>
            <span class="en">You are currently offline. Check your connection and try again.</span>
            <span class="de">Sie sind derzeit offline. Bitte prüfen Sie Ihre Verbindung und versuchen Sie es erneut.</span>
        </p>
        <a href="index.html" class="btn">
            <span class="en">Retry</span><span class="de">Erneut versuchen</span>
        </a>
        <div class="status">Service Worker active · App shell cached</div>
    </div>
    <script>
        // Tag the document with the user's preferred language so the CSS
        // hides the wrong block. No external script needed; CSP-clean.
        var lang = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
        document.documentElement.setAttribute("lang", lang);
    </script>
</body>
</html>
