<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; media-src 'self' https://assets.mixkit.co data: blob:; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Smart QR Doorbell - Contactless visitor check-in system">
    <meta name="theme-color" content="#f59e0b">
    <title>QR Doorbell - Guest</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">

</head>
<body>
    <div class="mesh-bg"></div>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="grain-overlay"></div>

    <div class="app-shell animate-fade-in">
        <div class="offline-banner" id="offline-indicator">
            <span data-i18n="offline_message">Network Interrupted</span>
        </div>

        <main class="hero-container">
            <div class="entry-card">
                <div class="entry-header">
                    <h1 class="entry-title" data-i18n="guest_title">QR DoorBell</h1>
                    <button class="info-toggle" id="info-trigger" aria-label="How It Works">i</button>
                </div>

                <div id="main-interface" class="interface-stack">


                    <div class="input-panel" id="message-drawer">
                        <textarea id="message" class="text-area-premium" data-i18n-placeholder="visitor_memo" placeholder="Optional note for occupant" rows="3" maxlength="500"></textarea>
                        <div class="character-count" id="char-counter">0 / 500</div>
                    </div>

                    <div class="action-center">
                        <div class="signal-wrapper" id="action-bar">
                            <button class="toggle-input" id="message-toggle" aria-label="Attach note">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="msg-svg"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            </button>
                            <div class="ring-core" id="ring-container">
                                <div class="ping-wave"></div>
                                <button id="ring-btn" class="btn-signal-primary" data-action="send-ring">
                                    <span id="ring-btn-text" data-i18n="ring_button">Signal</span>
                                </button>
                            </div>
                        </div>

                        <div id="status-error" class="feedback-state error">
                            <div class="feedback-content">
                                <span id="error-text">Token Missing</span>
                            </div>
                            <button class="btn-retry" data-action="retry-capture">&#8635;</button>
                        </div>

                        <div id="status-success" class="feedback-state success">
                            <div class="feedback-content">
                                <span data-i18n="ring_button_sent">Signal Dispatched</span>
                            </div>
                        </div>
                    </div>

                    <div id="timestamp-view" class="meta-footer" style="display:none;"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="reply-panel" class="response-card-fixed">
        <div class="response-header">
            <div class="live-tag">
                <div class="live-pulse"></div>
                <span data-i18n="reply_inbound">Live Response</span>
            </div>
            <button id="modal-close-reply" class="btn-close-mini" style="display:none;">&times;</button>
        </div>

        <!-- Threaded Chat History (Now inside the reply panel) -->
        <div id="chat-thread" class="chat-history-container">
            <div id="chat-messages" class="chat-messages-list">
                <!-- Messages injected here -->
            </div>
        </div>

        <div class="response-footer">
            <div id="reply-timestamp" class="response-time"></div>
            <button id="reply-btn" class="btn-reply-action" data-i18n="btn_reply">Reply</button>
        </div>
    </div>


    <div id="secure-modal" class="overlay-blur">
        <div class="modal-sheet animate-sheet-in">
            <div class="sheet-handle"></div>
            <h2 data-i18n="how_it_works">Security Overview</h2>
            <p data-i18n="instruction_desc">Your request is sent instantly to the owner. Stay on this screen for a live response.</p>
            <button class="btn btn-primary btn-full" id="modal-close">Understood</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/utils.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/guest.js"></script>
</body>
</html>
